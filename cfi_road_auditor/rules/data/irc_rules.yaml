# CFI Road Auditor - IRC / MoRTH compliance rule database (v0.1)
# Each rule: id, category, title, standard_ref, requirement, check (type + params), severity, likelihood,
# users (affected road users), recommendation, agency, applies_to (road classes, default all), confidence of the
# standard value (high/medium/low). Thresholds may be dicts keyed by road class group: urban | rural | expressway.
#
# check types
#   asset_attr     : for each asset of `asset`, compare attributes[attr] with op/threshold (missing attr -> not assessed)
#   asset_size     : compare asset.size_m[0|1] (width/length) with threshold
#   asset_presence : require >= min_count assets of `asset` across the audit (else one finding at ch 0)
#   asset_requires : for each asset of `asset`, require an asset of any `requires` within [-upstream_m, downstream_m]
#   asset_forbidden_near : finding when `asset` has `near` asset within window
#   segment_metric : for each segment compare metrics[metric] with op/threshold (missing -> not assessed)
#   segment_flag   : for each segment where flags[flag] == true and condition on metrics -> finding
#   density        : count of `asset` per km > threshold -> finding (whole audit)
#   asset_conf     : every asset of a type is itself a deficiency (pothole, open manhole, encroachment ...)
meta:
  version: "0.1.0"
  risk_matrix: "IRC:SP:88-2019 style 4x4 (severity x likelihood)"
  class_groups:
    urban: [urban_arterial, urban_sub_arterial, urban_collector, urban_local]
    rural: [national_highway, state_highway, major_district_road, other_district_road, village_road]
    expressway: [expressway]

rules:
# ============================================================ PAVEMENT CONDITION
- id: PAV-001
  category: pavement
  title: Pothole on carriageway
  standard_ref: "IRC:82-2015 Cl. 4 & Table 1 (maintenance of bituminous surfaces); MoRTH pothole-free mandate"
  requirement: "Carriageway shall be free of potholes; potholes to be repaired within 24-48 h on NH/urban arterials (IRC:82 response norms)."
  check: {type: asset_conf, asset: pothole, min_conf: 0.3}
  severity_by_size: {width_m: [[0.0, 0.3, medium], [0.3, 0.45, high], [0.45, 99, critical]]}
  severity: high
  likelihood: probable
  users: [motorcyclists, cyclists, car occupants]
  recommendation: "Cut to regular shape, clean, tack coat and fill with hot/cold bituminous mix compacted flush; log in maintenance register; investigate drainage if recurrent."
  agency: "Road owning agency / maintenance contractor"
  confidence: high
- id: PAV-002
  category: pavement
  title: Pothole density exceeds maintenance threshold
  standard_ref: "IRC:82-2015 Table 1 (serviceability levels)"
  requirement: "Good serviceability: no potholes; Fair: < 2 per km; Poor: >= 5 per km."
  check: {type: density, asset: pothole, per_km_gt: 5, min_conf: 0.3}
  severity: high
  likelihood: frequent
  users: [all]
  recommendation: "Programme patch repair followed by profile correction/resurfacing of the section; review pavement drainage."
  agency: "Road owning agency"
  confidence: high
- id: PAV-003
  category: pavement
  title: Alligator / map cracking indicating structural failure
  standard_ref: "IRC:82-2015 Cl. 4.2; IRC:81 (structural evaluation)"
  requirement: "Alligator cracking > 10% of area requires structural treatment."
  check: {type: asset_conf, asset: crack_alligator, min_conf: 0.4}
  severity: medium
  likelihood: occasional
  users: [motorcyclists]
  recommendation: "Seal cracks; where extensive, mill and overlay / reconstruct after FWD/BBD evaluation."
  agency: "Road owning agency"
  confidence: medium
- id: PAV-004
  category: pavement
  title: Longitudinal / transverse cracking
  standard_ref: "IRC:82-2015 Cl. 4.2"
  requirement: "Cracks > 3 mm to be sealed to prevent water ingress."
  check: {type: asset_conf, asset: crack_longitudinal, min_conf: 0.45}
  severity: low
  likelihood: occasional
  users: [motorcyclists]
  recommendation: "Crack sealing with bitumen emulsion/sealant; monitor."
  agency: "Road owning agency"
  confidence: medium
- id: PAV-005
  category: pavement
  title: Open / sunken manhole on carriageway
  standard_ref: "IRC:SP:88-2019 checklist (surface hazards); IRC:86 Cl. on utilities"
  requirement: "Utility covers shall be flush (+/- 6 mm) with the riding surface and never left open."
  check: {type: asset_conf, asset: open_manhole, min_conf: 0.3}
  severity: critical
  likelihood: probable
  users: [motorcyclists, cyclists, pedestrians]
  recommendation: "Immediate barricading and cover replacement; raise/lower frame to grade."
  agency: "Utility agency / ULB"
  confidence: high
- id: PAV-006
  category: pavement
  title: Water-logging on carriageway
  standard_ref: "IRC:SP:42-2014 (road drainage); IRC:SP:50"
  requirement: "Carriageway shall drain freely; standing water indicates inadequate camber/cross-fall or blocked drains."
  check: {type: asset_conf, asset: waterlogging, min_conf: 0.4}
  severity: medium
  likelihood: occasional
  users: [motorcyclists, pedestrians]
  recommendation: "Clear drains/inlets, correct camber (2-2.5% bituminous), provide additional gullies."
  agency: "ULB drainage wing"
  confidence: medium
- id: PAV-007
  category: pavement
  title: Debris / construction material on carriageway
  standard_ref: "IRC:SP:55-2014 Cl. 4 (work zone housekeeping)"
  requirement: "No loose material, debris or spillage on the trafficked surface."
  check: {type: asset_conf, asset: debris, min_conf: 0.4}
  severity: medium
  likelihood: occasional
  users: [motorcyclists]
  recommendation: "Remove debris; enforce work-zone housekeeping; sweep regularly."
  agency: "Road owning agency"
  confidence: medium

# ============================================================ CROSS-SECTION
- id: XS-001
  category: cross_section
  title: Lane width below minimum
  standard_ref: "IRC:86-2018 Cl. 6 Table (urban) / IRC:73-1980 Cl. 5 (rural) / IRC:SP:99 (expressway): standard lane 3.5 m; 3.0 m minimum on local streets; 3.75 m expressway"
  requirement: "Lane width >= 3.5 m on arterials / NH / SH; >= 3.25 m sub-arterial, collector, MDR; >= 3.0 m local streets / ODR / VR; 3.75 m expressway."
  check: {type: segment_metric, metric: lane_width_m, op: "<", threshold: {urban_arterial: 3.5, urban_sub_arterial: 3.25, urban_collector: 3.25, urban_local: 3.0, national_highway: 3.5, state_highway: 3.5, major_district_road: 3.25, other_district_road: 3.0, village_road: 3.0, expressway: 3.75}, tolerance: 0.15}
  severity: medium
  likelihood: probable
  users: [all]
  recommendation: "Re-mark lanes to standard widths; remove encroachment; widen carriageway where right-of-way permits."
  agency: "Road owning agency"
  confidence: high
- id: XS-002
  category: cross_section
  title: Carriageway narrower than two-lane standard
  standard_ref: "IRC:73-1980 Cl. 5.2 (2-lane 7.0 m, intermediate 5.5 m, single 3.75 m); IRC:86-2018 Table 4"
  requirement: "Two-lane carriageway 7.0 m; a width between 5.5 m and 7.0 m is sub-standard for two-way traffic."
  check: {type: segment_metric, metric: carriageway_width_m, op: "<", threshold: {urban: 7.0, rural: 7.0, expressway: 14.0}, min_conf: 0.5, tolerance: 0.25}
  severity: medium
  likelihood: occasional
  users: [all]
  recommendation: "Widen to 7.0 m or designate single-lane with passing places; provide edge lines and hazard markers."
  agency: "Road owning agency"
  confidence: high
- id: XS-003
  category: cross_section
  title: Sharp horizontal curve below minimum radius for design speed
  standard_ref: "IRC:38-1988 Table 1 / IRC:73-1980 Table 11 / IRC:86-2018: R_min = V^2 / 127(e+f), e=0.07, f=0.15"
  requirement: "Horizontal curve radius >= ruling minimum for the design speed (e.g. 60 km/h -> 130 m; 80 km/h -> 230 m; 50 km/h -> 90 m)."
  check: {type: segment_metric, metric: curve_radius_m, op: "<", threshold: "min_radius_for_design_speed", min_conf: 0.3}
  severity: high
  likelihood: probable
  users: [all]
  recommendation: "Provide curve warning + chevron signs, advisory speed plate, super-elevation check, delineators; consider realignment."
  agency: "Road owning agency"
  confidence: high
- id: XS-004
  category: cross_section
  title: Gradient steeper than ruling gradient
  standard_ref: "IRC:73-1980 Table 10 / IRC:SP:23: ruling 3.3% plain, 5% rolling, 6% mountainous; limiting 5/6/7%"
  requirement: "Longitudinal gradient <= ruling gradient (3.3% plain; 5% rolling; 6% mountainous; 7% steep)."
  check: {type: segment_metric, metric: gradient_pct, op: ">", threshold: {plain: 5.0, rolling: 6.0, mountainous: 7.0, steep: 8.0}, min_conf: 0.3}
  severity: medium
  likelihood: occasional
  users: [heavy vehicles, cyclists]
  recommendation: "Steep gradient warning signs, climbing lane, surface friction improvement, escape/arrester provisions on long down grades."
  agency: "Road owning agency"
  confidence: medium
- id: XS-005
  category: cross_section
  title: Sub-standard lane width on narrow segment with heavy two-wheeler exposure
  standard_ref: "IRC:SP:88-2019 Checklist (cross-section vs traffic mix)"
  requirement: "Where motorised two-wheelers dominate, lane width <= 3.0 m with mixed traffic increases side-swipe risk."
  check: {type: segment_metric, metric: lane_width_m, op: "<", threshold: 3.0, requires_metric: {motorcycle_per_frame: 1.0}}
  severity: medium
  likelihood: probable
  users: [motorcyclists]
  recommendation: "Re-marking, enforcement against on-street parking, dedicated two-wheeler / NMT lanes where ROW allows."
  agency: "Road owning agency / Traffic police"
  confidence: medium

# ============================================================ MARKINGS (IRC:35-2015)
- id: MRK-001
  category: markings
  title: Zebra crossing stripe width non-compliant
  standard_ref: "IRC:35-2015 Cl. 6.5.1 / Fig: zebra stripes 500 mm wide with 500 mm gaps (tolerance +/- 100 mm)"
  requirement: "Zebra stripes 500 mm wide, gaps 500 mm; stripes parallel to traffic flow."
  check: {type: asset_attr, asset: zebra_crossing, attr: stripe_width_m, op: outside, threshold: [0.38, 0.65]}
  severity: low
  likelihood: occasional
  users: [pedestrians]
  recommendation: "Re-paint zebra to 500 mm stripe / 500 mm gap with thermoplastic retro-reflective paint."
  agency: "ULB / Road owning agency"
  confidence: high
- id: MRK-002
  category: markings
  title: Zebra crossing length (in direction of traffic) below minimum
  standard_ref: "IRC:35-2015 Cl. 6.5; IRC:103-2012 Cl. 7.2: crossing width 2 m min (4 m where pedestrian volumes high); widths up to 6 m at busy locations"
  requirement: "Zebra crossing shall be at least 2.0 m wide (measured along the direction of vehicular travel); 4.0 m on arterials."
  check: {type: asset_attr, asset: zebra_crossing, attr: crossing_length_m, op: "<", threshold: {urban: 2.0, rural: 2.0, expressway: 2.0}}
  severity: low
  likelihood: occasional
  users: [pedestrians]
  recommendation: "Widen crossing marking to 4 m on arterial/sub-arterial roads, 2-3 m on collectors."
  agency: "ULB"
  confidence: high
- id: MRK-003
  category: markings
  title: Zebra crossing without advance pedestrian-crossing warning sign
  standard_ref: "IRC:67-2022 (Cautionary sign 'Pedestrian Crossing' ahead); IRC:103-2012 Cl. 7.2.4; IRC:35-2015"
  requirement: "Uncontrolled pedestrian crossings shall be preceded by a 'Pedestrian Crossing' cautionary sign 40-50 m in advance (urban)."
  check: {type: asset_requires, asset: zebra_crossing, requires: [sign_pedestrian_crossing, sign_cautionary, sign_unknown], upstream_m: 120, downstream_m: 5}
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Install retro-reflective 'Pedestrian Crossing' cautionary sign (900 mm triangle) 40-50 m ahead on both approaches; add 'Pedestrian Crossing Ahead' pavement marking."
  agency: "ULB / Traffic police"
  confidence: high
- id: MRK-004
  category: markings
  title: Zebra crossing without stop line / give-way line
  standard_ref: "IRC:35-2015 Cl. 6.4 (stop line 200-300 mm, 2-3 m before crossing)"
  requirement: "A stop line (200 mm urban / 300 mm rural, 2 m-3 m ahead of the crossing) shall accompany a zebra crossing at a controlled location; a give-way line at uncontrolled ones."
  check: {type: asset_requires, asset: zebra_crossing, requires: [stop_line, give_way_marking], upstream_m: 15, downstream_m: 3}
  severity: medium
  likelihood: probable
  users: [pedestrians]
  recommendation: "Mark stop line 2-3 m before crossing; renew on each approach."
  agency: "ULB / Traffic police"
  confidence: high
- id: MRK-005
  category: markings
  title: Lane line width non-standard
  standard_ref: "IRC:35-2015 Cl. 4.2 / Table 1: lane lines 100 mm (urban) / 150 mm (rural highways); edge lines 150-200 mm"
  requirement: "Longitudinal lane lines 100 mm wide on urban roads, 150 mm on highways; edge lines 150-200 mm."
  check: {type: asset_attr, asset: lane_line, attr: line_width_m, op: outside, threshold: {urban: [0.08, 0.24], rural: [0.11, 0.26], expressway: [0.13, 0.26]}}
  severity: info
  likelihood: improbable
  users: [all]
  recommendation: "Re-mark to standard width with retro-reflective thermoplastic (IRC:35 material spec)."
  agency: "Road owning agency"
  confidence: high
- id: MRK-006
  category: markings
  title: No visible lane / centre-line marking on segment
  standard_ref: "IRC:35-2015 Cl. 4 (centre line mandatory on 2-lane and wider roads); IRC:SP:88 checklist 'delineation'"
  requirement: "All roads >= 5.5 m wide shall have a centre line; multi-lane roads shall have lane lines; edge lines on rural highways."
  check: {type: segment_metric, metric: n_lines, op: "<", threshold: 1, requires_metric: {carriageway_width_m: 5.5}}
  severity: medium
  likelihood: probable
  users: [all]
  recommendation: "Provide centre/lane/edge lines in thermoplastic with glass beads; re-stripe when retro-reflectivity < 100 mcd/m2/lx."
  agency: "Road owning agency"
  confidence: high
- id: MRK-007
  category: markings
  title: Stop line thickness non-standard
  standard_ref: "IRC:35-2015 Cl. 6.4: stop line 200 mm (urban) to 300 mm (rural / high speed)"
  requirement: "Stop line 200-300 mm wide across the approach lanes."
  check: {type: asset_attr, asset: stop_line, attr: thickness_m, op: outside, threshold: [0.17, 0.40]}
  severity: info
  likelihood: improbable
  users: [all]
  recommendation: "Re-mark to 200/300 mm."
  agency: "ULB"
  confidence: high

# ============================================================ PEDESTRIAN FACILITIES (IRC:103-2012)
- id: PED-001
  category: pedestrian
  title: No footpath on road with pedestrian activity
  standard_ref: "IRC:103-2012 Cl. 5.1 / Table 1: footpath mandatory on urban roads; minimum clear width 1.8 m"
  requirement: "Continuous footpath of >= 1.8 m clear width on both sides of urban roads (2.5 m commercial, 4.0 m high-intensity)."
  check: {type: segment_flag, flag: footpath_assessed, equals: true, metric_lt: {footpath_present: 0.5}, requires_metric_any: {pedestrian_per_frame: 0.2}}
  applies_to: [urban_arterial, urban_sub_arterial, urban_collector, urban_local, national_highway, state_highway]
  severity: critical
  likelihood: frequent
  users: [pedestrians]
  recommendation: "Construct raised footpath >= 1.8 m clear (kerb 150 mm) with tactile paving; where ROW is short, provide at-grade protected walkway with bollards."
  agency: "ULB / Road owning agency"
  confidence: high
- id: PED-002
  category: pedestrian
  title: Footpath clear width below 1.8 m
  standard_ref: "IRC:103-2012 Cl. 5.1 Table 1"
  requirement: "Footpath clear (obstruction-free) width >= 1.8 m."
  check: {type: segment_metric, metric: footpath_width_m, op: "<", threshold: 1.8}
  severity: high
  likelihood: probable
  users: [pedestrians, persons with disabilities]
  recommendation: "Relocate utilities/poles, remove encroachments, widen footpath."
  agency: "ULB"
  confidence: high
- id: PED-003
  category: pedestrian
  title: Footpath obstructed / encroached
  standard_ref: "IRC:103-2012 Cl. 5.3 (obstruction-free zone); IRC:SP:88 checklist 'encroachments'"
  requirement: "Furniture/hawkers/parking shall not reduce the clear footpath width below 1.8 m."
  check: {type: segment_metric, metric: footpath_obstructed, op: ">", threshold: 0.5}
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Enforce hawker zones per Street Vendors Act, relocate utilities, bollards against parking."
  agency: "ULB / Traffic police"
  confidence: medium
- id: PED-004
  category: pedestrian
  title: Pedestrians walking on carriageway (exposure)
  standard_ref: "IRC:SP:88-2019 checklist 'vulnerable road users'; IRC:103-2012"
  requirement: "Pedestrian activity on the carriageway indicates missing/unusable footpath or crossing facilities."
  check: {type: segment_metric, metric: pedestrian_per_frame, op: ">", threshold: 1.5, requires_flag_false: has_footpath}
  severity: high
  likelihood: frequent
  users: [pedestrians]
  recommendation: "Provide/clear footpaths; add crossings at desire lines; reduce speeds with calming; lighting."
  agency: "ULB / Traffic police"
  confidence: medium
- id: PED-005
  category: pedestrian
  title: Pedestrian crossing spacing exceeds 250 m on urban arterial
  standard_ref: "IRC:103-2012 Cl. 7.1 (crossing every 250 m or at desire lines / bus stops / schools)"
  requirement: "Safe crossing opportunity at least every 250 m in built-up areas."
  check: {type: spacing, asset: zebra_crossing, max_gap_m: 300, min_length_m: 400}
  applies_to: [urban_arterial, urban_sub_arterial, urban_collector]
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Add zebra crossings / refuge islands / pelican signals at desire lines, bus stops and schools."
  agency: "ULB"
  confidence: high
- id: PED-006
  category: pedestrian
  title: Zebra crossing on multi-lane carriageway without central refuge
  standard_ref: "IRC:103-2012 Cl. 7.3 (refuge island min 1.2 m, preferably 2.0 m, where carriageway > 11 m or 4+ lanes)"
  requirement: "Crossings over carriageways wider than 11 m (or 4+ lanes undivided) shall have a pedestrian refuge island >= 1.2 m (preferably 2 m) wide."
  check: {type: asset_requires, asset: zebra_crossing, requires: [refuge_island, median], upstream_m: 10, downstream_m: 10, requires_metric: {carriageway_width_m: 11.0}}
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Provide kerbed refuge island with bollards and object markers; stage the crossing."
  agency: "ULB"
  confidence: high
- id: PED-007
  category: pedestrian
  title: Signalised junction without pedestrian signal / phase
  standard_ref: "IRC:93-1985 Cl. 5 (pedestrian signals); IRC:103-2012 Cl. 7.4; IRC:SP:88 checklist"
  requirement: "Signalised intersections in urban areas shall provide pedestrian signal heads and an all-red/pedestrian phase."
  check: {type: asset_requires, asset: traffic_signal, requires: [pedestrian_signal], upstream_m: 40, downstream_m: 40}
  applies_to: [urban_arterial, urban_sub_arterial, urban_collector, urban_local]
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Install pedestrian signal heads with countdown and audible units; provide zebra on every arm."
  agency: "Traffic police / ULB"
  confidence: medium
- id: PED-008
  category: pedestrian
  title: Signalised junction without zebra crossing
  standard_ref: "IRC:35-2015 Cl. 6.5; IRC:103-2012 Cl. 7.2"
  requirement: "Every arm of a signalised junction shall have a marked pedestrian crossing."
  check: {type: asset_requires, asset: traffic_signal, requires: [zebra_crossing], upstream_m: 45, downstream_m: 45}
  severity: high
  likelihood: probable
  users: [pedestrians]
  recommendation: "Mark zebra crossings 2 m behind stop lines on all approaches."
  agency: "Traffic police / ULB"
  confidence: high
- id: PED-009
  category: pedestrian
  title: Kerb height non-standard
  standard_ref: "IRC:86-2018 Cl. 10 (kerb 150 mm, max 200 mm; mountable 100 mm); IRC:103-2012 Cl. 5.2"
  requirement: "Footpath kerb 150 mm above carriageway (max 200 mm); kerb ramps at crossings."
  check: {type: segment_metric, metric: kerb_height_m, op: outside, threshold: [0.10, 0.22]}
  severity: low
  likelihood: occasional
  users: [pedestrians, persons with disabilities]
  recommendation: "Rebuild kerb to 150 mm; provide kerb ramps (1:12) with tactile warning."
  agency: "ULB"
  confidence: high
- id: PED-010
  category: pedestrian
  title: Pedestrian guardrail/fence absent at high pedestrian-vehicle conflict location
  standard_ref: "IRC:103-2012 Cl. 8 (guardrails to channelise pedestrians to crossings near schools/markets)"
  requirement: "Pedestrian guardrails to channelise crossing movements at high-volume, high-speed locations."
  check: {type: segment_metric, metric: pedestrian_per_frame, op: ">", threshold: 3.0, requires_metric: {car_per_frame: 2.0}, requires_count_zero: guardrail}
  severity: medium
  likelihood: probable
  users: [pedestrians]
  recommendation: "Provide guardrails/planters to channelise pedestrians to crossings; keep sight lines (max height 1.1 m)."
  agency: "ULB"
  confidence: medium

# ============================================================ SIGNS (IRC:67-2022)
- id: SGN-001
  category: signs
  title: Speed hump without advance 'Speed Breaker' warning sign
  standard_ref: "IRC:99-2018 Cl. 6.4 & IRC:67-2022: cautionary sign 'Speed Breaker' 40 m (urban) / 100 m (rural) in advance; hump itself marked"
  requirement: "Each speed hump shall be preceded by a cautionary 'Hump/Speed Breaker' sign at 40-50 m (urban) and a 'Speed Breaker Ahead' informatory plate."
  check: {type: asset_requires, asset: speed_hump, requires: [sign_speed_breaker, sign_cautionary, sign_unknown], upstream_m: 120, downstream_m: 5}
  severity: high
  likelihood: probable
  users: [motorcyclists, car occupants]
  recommendation: "Install 'Speed Breaker' cautionary sign (triangle 900 mm) 40 m ahead with distance plate; paint hump with alternate black-white/yellow bands; add cat's eyes."
  agency: "Road owning agency / Traffic police"
  confidence: high
- id: SGN-002
  category: signs
  title: Speed hump without reflective hump markings
  standard_ref: "IRC:99-2018 Cl. 6.4; IRC:35-2015 Cl. 7 (hump marking - alternate black & white / yellow bands with retro-reflective paint)"
  requirement: "Humps shall be painted with alternate black and white (or yellow) bands visible at night."
  check: {type: asset_attr, asset: speed_hump, attr: marked, op: "==", threshold: false}
  severity: critical
  likelihood: probable
  users: [motorcyclists]
  recommendation: "Paint hump with alternating 300 mm black/white thermoplastic chevrons and install road studs."
  agency: "Road owning agency"
  confidence: high
- id: SGN-003
  category: signs
  title: Sign mounted too low / too high
  standard_ref: "IRC:67-2022 Cl. 4: bottom edge 2.0-2.5 m above kerb in urban areas (pedestrian clearance); 1.5-2.0 m rural (edge of carriageway)"
  requirement: "Urban: sign bottom 2.0-2.5 m above footpath; rural: 1.5-2.0 m above road edge."
  check: {type: asset_attr, asset: sign_unknown, attr: mounting_height_m, op: outside, threshold: {urban: [1.9, 2.6], rural: [1.4, 2.3], expressway: [1.8, 2.6]}, tolerance: 0.0}
  severity: low
  likelihood: occasional
  users: [pedestrians, all]
  recommendation: "Re-mount sign to standard height."
  agency: "Road owning agency"
  confidence: high
- id: SGN-004
  category: signs
  title: Signalised intersection without advance 'Traffic Signal Ahead' sign (high-speed approach)
  standard_ref: "IRC:67-2022 (cautionary 'Traffic Signal Ahead'); IRC:93-1985 Cl. 6"
  requirement: "Where approach speed >= 50 km/h or signal visibility < SSD, provide 'Traffic Signal Ahead' cautionary sign."
  check: {type: asset_requires, asset: traffic_signal, requires: [sign_cautionary, sign_unknown], upstream_m: 150, downstream_m: 0, requires_speed_ge: 50}
  severity: medium
  likelihood: occasional
  users: [all]
  recommendation: "Install 'Traffic Signal Ahead' sign 80-120 m in advance, with overhead signal repeaters."
  agency: "Traffic police / Road owning agency"
  confidence: medium
- id: SGN-005
  category: signs
  title: No speed limit sign on surveyed length
  standard_ref: "IRC:67-2022 (Mandatory sign 'Speed Limit'); MoRTH notification S.O.1522(E) 6-Apr-2018 (speed limits); IRC:SP:88 checklist"
  requirement: "Speed limit signs repeated after every major junction and at least every 1-2 km in urban areas."
  check: {type: asset_presence, asset: sign_speed_limit, min_count: 1, min_length_m: 1000, alt_assets: [sign_mandatory]}
  severity: medium
  likelihood: probable
  users: [all]
  recommendation: "Install speed limit signs per MoRTH 2018 notification (e.g. 50/60 km/h urban arterial) at section start and after junctions."
  agency: "Traffic police / Road owning agency"
  confidence: medium
- id: SGN-006
  category: signs
  title: Sharp curve without curve warning / chevron signs
  standard_ref: "IRC:67-2022 (Cautionary 'Left/Right Hand Curve', 'Hair-pin Bend'; chevron alignment markers); IRC:SP:88 checklist"
